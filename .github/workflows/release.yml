name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri-app:
    permissions:
      contents: write
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Build Tauri app (NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Antic Browser ${{ github.ref_name }}'
          releaseBody: |
            🎉 Новый релиз Antic Browser!
            
            ## Что нового
            - Антидетект браузер с продвинутыми функциями
            - Управление прокси (SX.ORG, CyberYozh, PSB Proxy)
            - Настройка профилей с fingerprinting
            - Автоматическая установка Node.js и Playwright/Chromium
            - Автоматические обновления
            
            ## Установка
            **Скачайте Antic.Browser_2.0.1_x64-setup.exe** (лаунчер) ниже.
            При первом запуске лаунчер автоматически:
            1. Установит основное приложение
            2. Скачает и настроит Node.js
            3. Установит Playwright и Chromium
            4. Запустит Antic Browser
            
            Все зависимости устанавливаются автоматически!
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

  build-launcher:
    needs: build-tauri-app
    permissions:
      contents: write
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install launcher dependencies
        run: |
          cd launcher
          npm install

      - name: Build launcher with electron-builder
        run: |
          cd launcher
          npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload launcher to release
        uses: softprops/action-gh-release@v1
        with:
          files: launcher/dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
